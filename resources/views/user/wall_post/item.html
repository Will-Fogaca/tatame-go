<div class="card mb-3 shadow-sm border-0 user-mural-post-card">
  <div class="card-body p-3 p-sm-4">

    <h5 class="card-title mb-3 fw-semibold text-break">
      {{title}}
    </h5>

    <p class="user-mural-post-content mb-3">{{content}}</p>

    <div class="d-flex flex-column flex-sm-row justify-content-sm-end gap-2 gap-sm-3 small text-muted">
      <span>
        <i class="bi bi-person me-1"></i>{{author}}
      </span>

      <span>
        <i class="bi bi-clock me-1"></i>{{date}}
      </span>
    </div>

  </div>
</div>

<style>
  .user-mural-post-card {
    border-radius: 1rem;
  }

  .user-mural-post-content {
    white-space: pre-line;
    word-break: break-word;
  }
</style>
