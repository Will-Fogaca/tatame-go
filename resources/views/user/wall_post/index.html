<div class="container mt-4">

  <div class="d-flex align-items-center gap-3 mb-4">
    <label class="form-label fw-semibold mb-0 text-nowrap">Academia:</label>
    <form method="GET" class="flex-grow-1">
      <select name="academy_id" class="form-select" onchange="this.form.submit()">
        {{academies}}
      </select>
    </form>
  </div>

  <h5 class="mb-3">
    <i class="bi bi-megaphone me-2"></i>Mural
  </h5>

  {{posts}}

  <div class="text-center text-muted mt-5 {{empty}}">
    <i class="bi bi-chat-left-text fs-1 d-block mb-2"></i>
    <p>Nenhum aviso no mural</p>
  </div>

</div>
