<div class="user-mural-page">

  <div class="page-header mb-4">
    <h4 class="fw-bold mb-1">
      <i class="bi bi-megaphone me-1"></i>
      Mural
    </h4>
    <p class="text-muted mb-0">Acompanhe os avisos da academia.</p>
  </div>

  <div class="card shadow-sm border-0 filter-card mb-4">
    <div class="card-body p-3 p-sm-4">

      <form method="GET">
        <label class="form-label">Academia</label>
        <select name="academy_id" class="form-select form-select-lg" onchange="this.form.submit()">
          {{academies}}
        </select>
      </form>

    </div>
  </div>

  <div class="posts-wrapper">
    {{posts}}
  </div>

  <div class="empty-state text-center text-muted mt-5 {{empty}}">
    <i class="bi bi-chat-left-text fs-1 d-block mb-2"></i>
    <p class="mb-0">Nenhum aviso no mural</p>
  </div>

</div>

<style>
  .user-mural-page .filter-card {
    max-width: 900px;
    border-radius: 1rem;
  }

  .user-mural-page .posts-wrapper {
    width: 100%;
  }

  @media (max-width: 575.98px) {
    .user-mural-page .page-header {
      text-align: center;
    }

    .user-mural-page .filter-card {
      max-width: 100%;
    }
  }
</style>
