<h4 class="mb-4">Cadastrar graduação</h4>

{{error}}
<form method="post" action="/admin/graduacao/cadastrar">

  <input type="hidden" name="academy_id" value="{{academy_id}}">

  <div class="mb-3">
    <label class="form-label">Descrição da graduação</label>
    <input type="text" name="description" class="form-control" placeholder="Ex: Faixa Branca" required>
  </div>


  <div class="mb-3">
    <div>
      <label class="form-label">Nível</label>
      <a href="/admin/graduacao/proximo" class="btn btn-outline-secondary">Próximo</a>
    </div>
    
    <input type="number" name="level" class="form-control" min="1" placeholder="Ex: 1" required>
    <small class="text-muted">
      Quanto menor o número, menor a graduação.
    </small>

    
  </div>

  <div class="d-flex justify-content-between mt-4">
    
    <a href="/admin/graduacao" class="btn btn-outline-secondary">
      ← Voltar
    </a>

    <button type="submit" class="btn btn-primary">
      Salvar graduação
    </button>

  </div>

</form>
