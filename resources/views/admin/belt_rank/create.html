<div class="page-header mb-4">
  <h4 class="fw-bold mb-1">Cadastrar graduação</h4>
  <p class="text-muted mb-0">Preencha os dados da nova faixa ou graduação.</p>
</div>

{{error}}

<div class="card shadow-sm border-0 form-card">
  <div class="card-body p-4 p-md-5">

    <form method="post" action="/admin/graduacao/cadastrar">
      <input type="hidden" id="academy_id" name="academy_id" value="{{academy_id}}">

      <div class="mb-3">
        <label for="description" class="form-label">Descrição</label>
        <input
          type="text"
          id="description"
          name="description"
          class="form-control form-control-lg"
          placeholder="Ex: Faixa Branca"
          required
        >
      </div>

      <div class="mb-4">
        <label for="level" class="form-label">Nível</label>

        <div class="row g-2">
          <div class="col-12 col-sm">
            <input
              type="number"
              id="level"
              name="level"
              value="{{next_level}}"
              class="form-control form-control-lg"
              min="1"
              required
            >
          </div>

          <div class="col-12 col-sm-auto">
            <button
              type="button"
              id="btn-next-level"
              class="btn btn-outline-secondary btn-lg w-100">
              <i class="bi bi-stars me-1"></i>
              Sugerir próximo
            </button>
          </div>
        </div>

        <div class="form-text mt-2">
          Quanto menor o número, menor a graduação.
        </div>
      </div>

      <hr class="my-4">

      <div class="d-grid d-sm-flex justify-content-sm-between gap-2">
        <a href="/admin/graduacao" class="btn btn-outline-secondary btn-lg">
          <i class="bi bi-arrow-left me-1"></i>
          Voltar
        </a>

        <button type="submit" class="btn btn-primary btn-lg">
          <i class="bi bi-check-lg me-1"></i>
          Salvar graduação
        </button>
      </div>
    </form>

  </div>
</div>

<style>
  .form-card {
    max-width: 720px;
    border-radius: 1rem;
  }

  @media (max-width: 575.98px) {
    .page-header {
      text-align: center;
    }

    .form-card {
      max-width: 100%;
    }
  }
</style>

<script>
  document.getElementById('btn-next-level').addEventListener('click', async function () {

      const academyId = document.getElementById('academy_id').value;

      try {

          const response = await fetch(
              '/admin/graduacao/proximo?academy_id=' + encodeURIComponent(academyId)
          );
          const text = await response.text();

      } catch (e) {
          console.error(e);
      }

  });
</script>
