<div class="mb-4">
  <h4 class="fw-medium mb-1">Cadastrar graduação</h4>
  <p class="text-muted small mb-0">Preencha os dados da nova faixa ou graduação</p>
</div>

{{error}}

<div class="card border shadow-none">
  <div class="card-body p-4">
    <form method="post" action="/admin/graduacao/cadastrar">
      <input type="hidden" name="academy_id" value="{{academy_id}}">

      <div class="mb-3">
        <label for="description" class="form-label small fw-medium text-secondary">Descrição</label>
        <input type="text" id="description" name="description" class="form-control" placeholder="Ex: Faixa Branca" required>
      </div>

      <div class="mb-3">
        <label for="level" class="form-label small fw-medium text-secondary">Nível</label>
        <div class="d-flex gap-2">
          <input type="number" id="level" name="level" class="form-control" min="1" placeholder="Ex: 1" required>
          <a href="/admin/graduacao/proximo" class="btn btn-outline-secondary text-nowrap">
            <i class="bi bi-stars me-1"></i>Sugerir próximo
          </a>
        </div>
        <div class="form-text">Quanto menor o número, menor a graduação.</div>
      </div>

      <hr class="my-4">

      <div class="d-flex justify-content-between">
        <a href="/admin/graduacao" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left me-1"></i>Voltar
        </a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-lg me-1"></i>Salvar graduação
        </button>
      </div>
    </form>
  </div>
</div>
