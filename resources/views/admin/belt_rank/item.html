<div class="card mb-3 shadow-sm border-0 belt-card">
  <div class="card-body p-3 p-sm-4">

    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-stretch align-items-sm-center gap-3">

      <div class="d-flex align-items-center gap-3 min-w-0">
        <span class="badge bg-dark belt-level">
          {{level}}
        </span>

        <div class="min-w-0">
          <div class="fw-semibold text-truncate">
            {{name}}
          </div>
          <small class="text-muted">
            Graduação
          </small>
        </div>
      </div>

      <div class="d-grid d-sm-flex gap-2 belt-actions">

        <a href="/admin/graduacao/editar?id={{id}}&academy_id={{academy_id}}" class="btn btn-primary btn-sm">
          <i class="bi bi-pencil"></i>
          <span class="d-sm-none ms-1">Editar</span>
        </a>

        <form method="POST"
              action="/admin/graduacao/excluir"
              onsubmit="return confirm('Tem certeza que deseja excluir este registro?')"
              class="m-0">

          <input type="hidden" name="id" value="{{id}}">
          <input type="hidden" name="academy_id" value="{{academy_id}}">

          <button type="submit" class="btn btn-danger btn-sm w-100">
            <i class="bi bi-trash"></i>
            <span class="d-sm-none ms-1">Excluir</span>
          </button>

        </form>

      </div>

    </div>

  </div>
</div>

<style>
  .belt-card {
    border-radius: 1rem;
  }

  .belt-level {
    min-width: 42px;
    min-height: 42px;
    border-radius: 0.85rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }

  .min-w-0 {
    min-width: 0;
  }

  @media (max-width: 575.98px) {
    .belt-actions .btn {
      min-height: 42px;
    }
  }
</style>
