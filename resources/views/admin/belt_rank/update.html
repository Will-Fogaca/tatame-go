<div class="page-header mb-4">
  <h4 class="fw-bold mb-1">Editar graduação</h4>
  <p class="text-muted mb-0">Atualize os dados da faixa ou graduação.</p>
</div>

<div class="card shadow-sm border-0 form-card">
  <div class="card-body p-4 p-md-5">

    <form method="POST" action="/admin/graduacao/editar">
      <input type="hidden" name="id" value="{{id}}">
      <input type="hidden" name="academy_id" value="{{academy_id}}">

      <div class="mb-3">
        <label for="description" class="form-label">Descrição</label>
        <input
          type="text"
          id="description"
          name="description"
          class="form-control form-control-lg"
          placeholder="Ex: Faixa Branca"
          value="{{description}}"
          required
        >
      </div>

      <div class="mb-4">
        <label for="level" class="form-label">Nível</label>
        <div class="row g-2">
          <div class="col-12 col-sm">
            <input
              type="number"
              id="level"
              name="level"
              class="form-control form-control-lg"
              min="1"
              placeholder="Ex: 1"
              value="{{level}}"
              required
            >
          </div>
        </div>
        <div class="form-text mt-2">Quanto menor o número, menor a graduação.</div>
      </div>

      <hr class="my-4">

      <div class="d-grid d-sm-flex justify-content-sm-between gap-2">
        <a href="/admin/graduacao?academy_id={{academy_id}}" class="btn btn-outline-secondary btn-lg">
          <i class="bi bi-arrow-left me-1"></i>
          Voltar
        </a>

        <button type="submit" class="btn btn-primary btn-lg">
          <i class="bi bi-check-lg me-1"></i>
          Salvar alterações
        </button>
      </div>
    </form>

  </div>
</div>

<style>
  .form-card {
    max-width: 720px;
    border-radius: 1rem;
  }

  @media (max-width: 575.98px) {
    .page-header {
      text-align: center;
    }

    .form-card {
      max-width: 100%;
    }
  }
</style>
