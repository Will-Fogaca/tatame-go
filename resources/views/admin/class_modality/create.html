<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Nova Modalidade</h4>
    <a href="/admin/aula/modalidade?academy_id={{academy_id}}" class="btn btn-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Voltar
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" action="/admin/aula/modalidade/cadastrar">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Academia <span class="text-danger">*</span></label>
                    <select name="academy_id" class="form-select" required>
                        <option value="">Selecione...</option>
                        {{academies}}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Nome da modalidade <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" value="{{name}}"
                           placeholder="Ex: Jiu-Jitsu, Muay Thai..." required>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i> Salvar
                </button>
                <a href="/admin/aula/modalidade?academy_id={{academy_id}}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
