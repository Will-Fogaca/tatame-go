<h4>Editar Academia</h4>

<form method="post" action="/admin/academia/editar">

  <input type="hidden" name="id" value="{{id}}">

  <div class="mb-3">
    <label class="form-label">Nome da academia</label>
    <input 
      type="text" 
      name="name" 
      class="form-control" 
      value="{{name}}" 
      required
    >
  </div>

  <div class="mb-3">
    <label class="form-label">Telefone</label>
    <input 
      type="text" 
      name="phone_number" 
      class="form-control" 
      value="{{phone_number}}"
    >
  </div>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">
      Salvar alterações
    </button>

    <a href="/admin/academia" class="btn btn-secondary">
      Voltar
    </a>
  </div>

</form>
