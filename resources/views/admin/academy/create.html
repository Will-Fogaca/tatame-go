<h4 class="mb-4">Cadastrar Academia</h4>

<div class="card shadow-sm border-0">

  <div class="card-body">

    <form method="post" action="/admin/academia/cadastrar">

      <div class="mb-3">
        <label class="form-label">Nome da academia</label>
        <input
          type="text"
          name="name"
          class="form-control"
          required
        >
      </div>

      <div class="mb-4">
        <label class="form-label">Telefone</label>
        <input
          type="text"
          name="phone_number"
          class="form-control"
        >
      </div>

      <div class="d-grid d-md-flex gap-2">
        <button type="submit" class="btn btn-primary">
          Salvar
        </button>

        <a href="/admin/academia" class="btn btn-outline-secondary">
          Voltar
        </a>
      </div>

    </form>

  </div>

</div>
