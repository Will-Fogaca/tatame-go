<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Editar Aula</h4>
    <a href="/admin/aula?academy_id={{academy_id}}" class="btn btn-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Voltar
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" action="/admin/aula/editar">
            <input type="hidden" name="id" value="{{id}}">

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Academia</label>
                    <select name="academy_id" class="form-select" disabled>
                        {{academies}}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Horário cadastrado</label>
                    <select name="schedule_id" id="schedule_id" class="form-select" onchange="fillFromSchedule(this)">
                        {{schedules}}
                    </select>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Data <span class="text-danger">*</span></label>
                    <input type="date" name="class_date" class="form-control" value="{{class_date}}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Início</label>
                    <input type="time" name="start_time" id="start_time" class="form-control" value="{{start_time}}">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Fim</label>
                    <input type="time" name="end_time" id="end_time" class="form-control" value="{{end_time}}">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Modalidade</label>
                    <select name="modality_id" id="modality_id" class="form-select">
                        {{modalities}}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Observações</label>
                    <input type="text" name="notes" class="form-control" value="{{notes}}" placeholder="Opcional...">
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i> Salvar alterações
                </button>
                <a href="/admin/aula?academy_id={{academy_id}}" class="btn btn-outline-secondary">Cancelar</a>
            </div>

        </form>
    </div>
</div>

<script>
function fillFromSchedule(select) {
    const opt = select.options[select.selectedIndex];
    if (!opt || !opt.value) return;
    const start    = opt.getAttribute('data-start');
    const end      = opt.getAttribute('data-end');
    const modality = opt.getAttribute('data-modality');
    if (start)    document.getElementById('start_time').value  = start.substring(0,5);
    if (end)      document.getElementById('end_time').value    = end.substring(0,5);
    if (modality) document.getElementById('modality_id').value = modality;
}
</script>
