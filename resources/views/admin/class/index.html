<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Aulas</h4>
    <a href="/admin/aula/cadastrar?academy_id={{academy_id}}" class="btn btn-primary btn-sm">
        <i class="bi bi-plus-lg me-1"></i> Nova aula
    </a>
</div>

<div class="card mb-3">
    <div class="card-body py-2">
        <form method="GET" action="/admin/aula" class="d-flex align-items-center gap-2">
            <label class="form-label mb-0 fw-semibold">Academia:</label>
            <select name="academy_id" class="form-select form-select-sm w-auto" onchange="this.form.submit()">
                {{academies}}
            </select>
        </form>
    </div>
</div>

<div class="card">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Data</th>
                    <th>Início</th>
                    <th>Fim</th>
                    <th>Modalidade</th>
                    <th>Observações</th>
                    <th class="text-center">Ações</th>
                </tr>
            </thead>
            <tbody>
                {{classes}}
            </tbody>
        </table>
    </div>
</div>

{{pagination}}
