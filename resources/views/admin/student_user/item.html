<tr>
  <td data-label="#">{{number}}</td>

  <td data-label="Usuário">
    <strong>{{user_name}}</strong>
  </td>

  <td data-label="E-mail" class="text-muted small">
    {{user_email}}
  </td>

  <td data-label="Aluno">
    {{student_name}}
  </td>

  <td data-label="Criado em" class="small">
    {{created_at}}
  </td>

  <td data-label="Ações" class="text-center">
    <form method="POST"
          action="/admin/vinculos/excluir"
          onsubmit="return confirm('Remover este vínculo?')"
          class="m-0 link-actions">

      <input type="hidden" name="id" value="{{id}}">

      <button type="submit" class="btn btn-danger btn-sm">
        <i class="bi bi-trash"></i>
        <span class="d-md-none ms-1">Remover</span>
      </button>

    </form>
  </td>
</tr>
