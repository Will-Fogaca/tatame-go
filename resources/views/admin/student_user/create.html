<div class="vinculo-page">

  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-stretch align-items-sm-center mb-4 gap-2">
    <div>
      <h4 class="fw-bold mb-1">Novo Vínculo</h4>
      <p class="text-muted mb-0">Busque o usuário e o aluno para criar o vínculo.</p>
    </div>

    <a href="/admin/vinculos" class="btn btn-outline-secondary btn-lg">
      <i class="bi bi-arrow-left me-1"></i>
      Voltar
    </a>
  </div>

  {{error}}

  <div class="card shadow-sm border-0 search-card mb-4">
    <div class="card-body p-3 p-sm-4">

      <form method="POST" action="/admin/vinculos/buscar">
        <div class="row g-3">

          <div class="col-12 col-md-6">
            <label class="form-label">Documento do usuário (CPF/CNPJ)</label>
            <input
              type="text"
              name="document"
              class="form-control form-control-lg"
              placeholder="Digite o CPF ou CNPJ..."
              value="{{document}}"
            >
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">Nome do aluno</label>
            <input
              type="text"
              name="search_name"
              class="form-control form-control-lg"
              placeholder="Digite o nome do aluno..."
              value="{{search_name}}"
            >
          </div>

          <div class="col-12">
            <button type="submit" class="btn btn-primary btn-lg w-100 w-sm-auto">
              <i class="bi bi-search me-1"></i>
              Buscar
            </button>
          </div>

        </div>
      </form>

    </div>
  </div>

  <div class="results-wrapper">
    {{results}}
  </div>

</div>

<style>
  .vinculo-page .search-card {
    max-width: 900px;
    border-radius: 1rem;
  }

  .vinculo-page .results-wrapper {
    width: 100%;
  }

  @media (max-width: 575.98px) {
    .vinculo-page h4,
    .vinculo-page p {
      text-align: center;
    }
  }
</style>
