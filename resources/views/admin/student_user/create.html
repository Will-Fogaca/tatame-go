<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Novo Vínculo</h4>
    <a href="/admin/vinculos" class="btn btn-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Voltar
    </a>
</div>

{{error}}

<div class="card mb-3">
    <div class="card-header fw-semibold">Buscar usuário e aluno</div>
    <div class="card-body">
        <form method="POST" action="/admin/vinculos/buscar">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Documento do usuário (CPF/CNPJ)</label>
                    <input type="text" name="document" class="form-control"
                           placeholder="Digite o CPF ou CNPJ..." value="{{document}}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nome do aluno</label>
                    <input type="text" name="search_name" class="form-control"
                           placeholder="Digite o nome do aluno..." value="{{search_name}}">
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-search me-1"></i> Buscar
                </button>
            </div>
        </form>
    </div>
</div>

{{results}}
