<div class="link-results row g-3">

  <div class="col-12 col-lg-4">
    <div class="card h-100 shadow-sm border-0 user-found-card">
      <div class="card-body p-4">

        <div class="d-flex align-items-center gap-3 mb-3">
          <div class="user-found-icon">
            <i class="bi bi-person-check"></i>
          </div>

          <div>
            <h6 class="fw-bold mb-0 text-success">Usuário encontrado</h6>
            <small class="text-muted">Dados do usuário localizado</small>
          </div>
        </div>

        <div class="info-line">
          <span>Nome</span>
          <strong>{{user_name}}</strong>
        </div>

        <div class="info-line">
          <span>E-mail</span>
          <strong class="text-break">{{user_email}}</strong>
        </div>

      </div>
    </div>
  </div>

  <div class="col-12 col-lg-8">
    <div class="card h-100 shadow-sm border-0 students-options-card">
      <div class="card-header bg-white p-3 p-sm-4">
        <h6 class="fw-bold mb-1">Selecione o aluno para vincular</h6>
        <small class="text-muted">Escolha um aluno da lista abaixo.</small>
      </div>

      <div class="card-body p-0">
        <div class="table-responsive-md">
          <table class="table table-hover align-middle mb-0 responsive-table link-options-table">
            <thead class="table-light">
              <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th class="text-end">Ação</th>
              </tr>
            </thead>

            <tbody>
              {{options}}
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

</div>

<style>
  .link-results .user-found-card,
  .link-results .students-options-card {
    border-radius: 1rem;
    overflow: hidden;
  }

  .link-results .user-found-icon {
    width: 44px;
    height: 44px;
    border-radius: 0.85rem;
    background: rgba(25, 135, 84, 0.12);
    color: #198754;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.35rem;
    flex-shrink: 0;
  }

  .link-results .info-line {
    padding: 0.75rem 0;
    border-top: 1px solid #e5e7eb;
  }

  .link-results .info-line span {
    display: block;
    font-size: 0.8rem;
    color: #64748b;
    margin-bottom: 0.15rem;
  }

  .link-results .info-line strong {
    display: block;
  }

  @media (max-width: 767.98px) {
    .link-results .responsive-table thead {
      display: none;
    }

    .link-results .responsive-table,
    .link-results .responsive-table tbody,
    .link-results .responsive-table tr,
    .link-results .responsive-table td {
      display: block;
      width: 100%;
    }

    .link-results .responsive-table tbody {
      padding: 0.75rem;
    }

    .link-results .responsive-table tr {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 1rem;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
    }

    .link-results .responsive-table td {
      border: 0;
      padding: 0.5rem 0;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      text-align: right;
      word-break: break-word;
    }

    .link-results .responsive-table td::before {
      content: attr(data-label);
      font-weight: 600;
      color: #64748b;
      text-align: left;
      flex-shrink: 0;
      max-width: 45%;
    }

    .link-results .responsive-table td:last-child {
      display: block;
      padding-top: 0.75rem;
      margin-top: 0.5rem;
      border-top: 1px solid #e5e7eb;
      text-align: left;
    }

    .link-results .responsive-table td:last-child::before {
      display: none;
    }

    .link-results .responsive-table td:last-child .btn {
      width: 100%;
      min-height: 42px;
    }
  }
</style>
