<div class="card mb-3">
    <div class="card-header fw-semibold">3. Selecione o aluno e confirme</div>
    <div class="card-body p-0">
        <form method="POST" action="/admin/vinculos/cadastrar">
            <input type="hidden" name="user_id" value="{{user_id}}">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Aluno</th>
                        <th>Idade</th>
                        <th class="text-center">Vincular</th>
                    </tr>
                </thead>
                <tbody>
                    {{options}}
                </tbody>
            </table>
        </form>
    </div>
</div>
