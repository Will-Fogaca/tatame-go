<div class="card shadow-sm border-0 link-confirm-card mb-3">
  <div class="card-header bg-white p-3 p-sm-4">
    <h6 class="fw-bold mb-1">3. Selecione o aluno e confirme</h6>
    <small class="text-muted">Escolha qual aluno será vinculado ao usuário.</small>
  </div>

  <div class="card-body p-0">
    <form method="POST" action="/admin/vinculos/cadastrar">
      <input type="hidden" name="user_id" value="{{user_id}}">

      <div class="table-responsive-md">
        <table class="table table-hover align-middle mb-0 responsive-table link-confirm-table">
          <thead class="table-light">
            <tr>
              <th>Aluno</th>
              <th>Idade</th>
              <th class="text-end">Vincular</th>
            </tr>
          </thead>

          <tbody>
            {{options}}
          </tbody>
        </table>
      </div>
    </form>
  </div>
</div>

  .link-confirm-card {
    border-radius: 1rem;
    overflow: hidden;
  }

    .link-confirm-card .responsive-table tr,

      display: block;
      width: 100%;
    }

    .link-confirm-card .responsive-table tbody {

    }

    .link-confirm-card .responsive-table tr {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 1rem;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
    }
