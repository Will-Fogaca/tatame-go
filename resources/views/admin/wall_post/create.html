<div class="container mt-5">

  <div class="row justify-content-center">
    <div class="col-md-8">

      <div class="card shadow-lg border-0">

        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">
            <i class="bi bi-megaphone"></i> Novo aviso
          </h5>
        </div>

        <div class="card-body">

          <form method="post" action="{{action}}">

            <input type="hidden" name="academy_id" value="{{academy_id}}">

            <div class="mb-3">
              <label class="form-label fw-semibold">Título</label>
              <input type="text" name="title" class="form-control form-control-lg" placeholder="Ex: Treino cancelado hoje">
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">Conteúdo</label>
              <textarea name="content" class="form-control" rows="5" placeholder="Digite o aviso..." required></textarea>
            </div>

            <div class="d-flex justify-content-between">

              <a href="/admin/mural?academy_id={{academy_id}}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Voltar
              </a>

              <button type="submit" class="btn btn-success px-4">
                <i class="bi bi-check-lg"></i> Salvar
              </button>

            </div>

          </form>

        </div>

      </div>

    </div>
  </div>

</div>
