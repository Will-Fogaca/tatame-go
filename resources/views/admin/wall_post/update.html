<div class="notice-form-page">

  <div class="page-header mb-4">
    <h4 class="fw-bold mb-1">
      <i class="bi bi-pencil-square me-1"></i>
      Editar aviso
    </h4>
    <p class="text-muted mb-0">Atualize o aviso publicado no mural.</p>
  </div>

  <div class="card shadow-sm border-0 form-card">
    <div class="card-body p-3 p-sm-4 p-md-5">

      <form method="post" action="{{action}}">

        <input type="hidden" name="id" value="{{id}}">
        <input type="hidden" name="academy_id" value="{{academy_id}}">

        <div class="mb-3">
          <label class="form-label">Título</label>
          <input
            type="text"
            name="title"
            class="form-control form-control-lg"
            value="{{title}}"
            placeholder="Ex: Treino cancelado hoje"
          >
        </div>

        <div class="mb-4">
          <label class="form-label">Conteúdo</label>
          <textarea
            name="content"
            class="form-control form-control-lg"
            rows="5"
            required
          >{{content}}</textarea>
        </div>

        <hr class="my-4">

        <div class="d-grid d-sm-flex justify-content-sm-between gap-2">
          <a href="/admin/mural?academy_id={{academy_id}}" class="btn btn-outline-secondary btn-lg">
            <i class="bi bi-arrow-left me-1"></i>
            Voltar
          </a>

          <button type="submit" class="btn btn-success btn-lg">
            <i class="bi bi-check-lg me-1"></i>
            Atualizar
          </button>
        </div>

      </form>

    </div>
  </div>

</div>

<style>
  .notice-form-page .form-card {
    max-width: 820px;
    border-radius: 1rem;
  }

  @media (max-width: 575.98px) {
    .notice-form-page .page-header {
      text-align: center;
    }

    .notice-form-page .form-card {
      max-width: 100%;
    }
  }
</style>
