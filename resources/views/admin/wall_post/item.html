<div class="card mb-3 shadow-sm border-0 mural-post-card">
  <div class="card-body p-3 p-sm-4">

    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-stretch align-items-sm-start gap-3 mb-3">

      <h5 class="card-title mb-0 fw-semibold text-break">
        {{title}}
      </h5>

      <div class="d-grid d-sm-flex gap-2 mural-post-actions">

        <a href="/admin/mural/editar?id={{id}}&academy_id={{academy_id}}" class="btn btn-sm btn-outline-primary">
          <i class="bi bi-pencil"></i>
          <span class="d-sm-none ms-1">Editar</span>
        </a>

        <form method="post"
              action="/admin/mural/excluir"
              onsubmit="return confirm('Tem certeza que deseja excluir este aviso?')"
              class="m-0">

          <input type="hidden" name="id" value="{{id}}">

          <button type="submit" class="btn btn-sm btn-outline-danger w-100">
            <i class="bi bi-trash"></i>
            <span class="d-sm-none ms-1">Excluir</span>
          </button>

        </form>

      </div>

    </div>

    <p class="mural-post-content mb-3">{{content}}</p>

    <div class="d-flex flex-column flex-sm-row justify-content-sm-end gap-2 gap-sm-3 small text-muted">

      <span>
        <i class="bi bi-person me-1"></i>{{author}}
      </span>

      <span>
        <i class="bi bi-clock me-1"></i>{{date}}
      </span>

    </div>

  </div>
</div>

<style>
  .mural-post-card {
    border-radius: 1rem;
  }

  .mural-post-content {
    white-space: pre-line;
    word-break: break-word;
  }

  @media (max-width: 575.98px) {
    .mural-post-actions .btn {
      min-height: 40px;
    }
  }
</style>
