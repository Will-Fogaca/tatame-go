<div class="card mb-3 shadow-sm border-0">
  <div class="card-body">

    <div class="d-flex justify-content-between align-items-start mb-2">

      <h5 class="card-title mb-0 fw-semibold">
        {{title}}
      </h5>

      <div class="d-flex gap-2">
        <a href="/admin/mural/editar?id={{id}}&academy_id={{academy_id}}" class="btn btn-sm btn-outline-primary">
          <i class="bi bi-pencil"></i>
        </a>

        <form method="post" action="/admin/mural/excluir" onsubmit="return confirm('Tem certeza que deseja excluir este aviso?')" class="m-0">

          <input type="hidden" name="id" value="{{id}}">

          <button type="submit" class="btn btn-sm btn-outline-danger">
            <i class="bi bi-trash"></i>
          </button>

        </form>

      </div>

    </div>

    <p style="white-space: pre-line;">{{content}}</p>

    <div class="d-flex justify-content-end gap-3 small text-muted">

      <span>
        <i class="bi bi-person"></i> {{author}}
      </span>

      <span>
        <i class="bi bi-clock"></i> {{date}}
      </span>

    </div>

  </div>
</div>
