<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Registro de Presença</h4>
    <a href="/admin/aula?academy_id={{academy_id}}" class="btn btn-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Voltar
    </a>
</div>

<div class="card mb-3">
    <div class="card-body">
        <div class="row g-2">
            <div class="col-auto">
                <span class="text-muted small">Data:</span>
                <strong>{{class_date}}</strong>
            </div>
            <div class="col-auto">
                <span class="text-muted small">Início:</span>
                <strong>{{start_time}}</strong>
            </div>
            <div class="col-auto">
                <span class="text-muted small">Modalidade:</span>
                <strong>{{modality_name}}</strong>
            </div>
        </div>
    </div>
</div>

<form method="POST" action="/admin/aula/presenca/salvar">
    <input type="hidden" name="class_id" value="{{class_id}}">
    <input type="hidden" name="academy_id" value="{{academy_id}}">

    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span class="fw-semibold">Alunos</span>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-outline-success btn-sm" onclick="markAll(true)">
                    <i class="bi bi-check-all"></i> Todos presentes
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="markAll(false)">
                    <i class="bi bi-x-lg"></i> Todos ausentes
                </button>
            </div>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Aluno</th>
                        <th class="text-center" style="width: 120px;">Presente</th>
                    </tr>
                </thead>
                <tbody>
                    {{students}}
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-3">
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg me-1"></i> Salvar presenças
        </button>
    </div>
</form>

<script>
function markAll(present) {
    document.querySelectorAll('input[name="present[]"]').forEach(cb => cb.checked = present);
}
</script>
