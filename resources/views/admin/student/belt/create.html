<div class="page-header mb-4">
  <h4 class="fw-bold mb-1">Nova Graduação</h4>
  <p class="text-muted mb-0">Adicione uma nova faixa ao aluno.</p>
</div>

<div class="card shadow-sm border-0 form-card">
  <div class="card-body p-4 p-md-5">

    <form method="post" action="/admin/aluno/graduacao/cadastrar">

      <input type="hidden" name="student_id" value="{{student_id}}">
      <input type="hidden" name="academy_id" value="{{academy_id}}">

      <div class="mb-3">
        <label class="form-label">Faixa</label>
        <select name="belt_rank_id" class="form-select form-select-lg" required>
          <option value="">Selecione a faixa</option>
          {{belt_options}}
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Data da graduação</label>
        <input type="date" name="awarded_at" class="form-control form-control-lg" value="{{today}}" required>
      </div>

      <div class="mb-4">
        <label class="form-label">Observações</label>
        <textarea name="notes" class="form-control form-control-lg" rows="4" placeholder="Opcional..."></textarea>
      </div>

      <hr class="my-4">

      <div class="d-grid d-sm-flex justify-content-sm-between gap-2">
        <a href="/admin/aluno/graduacao?student_id={{student_id}}&academy_id={{academy_id}}" class="btn btn-outline-secondary btn-lg">
          <i class="bi bi-arrow-left me-1"></i>
          Voltar
        </a>

        <button type="submit" class="btn btn-success btn-lg">
          <i class="bi bi-check-lg me-1"></i>
          Salvar graduação
        </button>
      </div>

    </form>

  </div>
</div>

<style>
  .form-card {
    max-width: 720px;
    border-radius: 1rem;
  }

  @media (max-width: 575.98px) {
    .page-header {
      text-align: center;
    }

    .form-card {
      max-width: 100%;
    }
  }
</style>
