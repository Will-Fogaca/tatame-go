<h4 class="mb-4">Histórico de Graduações</h4>

<div class="card shadow-sm border-0">

  <!-- HEADER -->
  <div class="card-header bg-white d-flex justify-content-between align-items-center">
    
    <div>
      <h6 class="mb-0 fw-bold">Graduações do Aluno</h6>
      <small class="text-muted">Histórico completo de faixas</small>
    </div>

    <a href="/admin/aluno/graduacao/cadastrar?student_id={{student_id}}&academy_id={{academy_id}}" 
       class="btn btn-success btn-sm">
      <i class="bi bi-plus-lg"></i> Nova graduação
    </a>

  </div>

  <!-- BODY -->
  <div class="card-body p-0">

    <table class="table table-hover align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th style="width: 60px;">#</th>
          <th>Faixa</th>
          <th style="width: 150px;">Data</th>
          <th>Observações</th>
          <th></th>
        </tr>
      </thead>

      <tbody>
        {{belts}}
      </tbody>
    </table>

  </div>

</div>
