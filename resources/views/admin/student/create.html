<section id="form" class="student-form-page">

  <div class="page-header mb-4">
    <h4 class="fw-bold mb-1">Cadastrar aluno</h4>
    <p class="text-muted mb-0">Preencha os dados do aluno.</p>
  </div>

  {{error}}

  <div class="card shadow-sm border-0 form-card">
    <div class="card-body p-3 p-sm-4 p-md-5">

      <form method="POST" action="/admin/aluno/cadastrar">

        <input type="hidden" name="academy_id" value="{{academy_id}}">

        <div class="row g-3">

          <div class="col-12 col-md-6">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control form-control-lg" name="name" autocomplete="name" required>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">Data de nascimento</label>
            <input type="date" class="form-control form-control-lg" name="birth_date" required>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">Telefone</label>
            <input type="text" class="form-control form-control-lg" name="phone_number" autocomplete="tel">
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">Responsável</label>
            <input type="text" class="form-control form-control-lg" name="guardian_name">
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">Telefone do responsável</label>
            <input type="text" class="form-control form-control-lg" name="guardian_phone" autocomplete="tel">
          </div>

          <div class="col-12">
            <label class="form-label">Observações</label>
            <textarea class="form-control form-control-lg" name="notes" rows="4"></textarea>
          </div>

        </div>

        <hr class="my-4">

        <div class="d-grid d-sm-flex justify-content-sm-between gap-2">
          <a href="/admin/aluno?academy_id={{academy_id}}" class="btn btn-outline-secondary btn-lg">
            <i class="bi bi-arrow-left me-1"></i>
            Voltar
          </a>

          <button type="submit" class="btn btn-primary btn-lg">
            <i class="bi bi-check-lg me-1"></i>
            Cadastrar
          </button>
        </div>

      </form>

    </div>
  </div>

</section>

<style>
  .student-form-page .form-card {
    max-width: 900px;
    border-radius: 1rem;
  }

  @media (max-width: 575.98px) {
    .student-form-page .page-header {
      text-align: center;
    }

    .student-form-page .form-card {
      max-width: 100%;
    }
  }
</style>
