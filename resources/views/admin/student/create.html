<section id="form" class="container mt-4">

  <div class="card bg-light text-dark border-secondary shadow">

    <div class="card-header border-secondary">
      <h5 class="mb-0">Cadastrar aluno</h5>
    </div>

    <div class="card-body">
      {{error}}
      
      <form method="POST" action="/admin/aluno/cadastrar" class="">

        <input type="hidden" name="academy_id" value="{{academy_id}}">

        <div class="row">

          <div class="col-md-6 mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" name="name" required>
          </div>

          
          <div class="col-md-6 mb-3">
            <label class="form-label">Data de nascimento</label>
            <input type="date" class="form-control" name="birth_date" required>
          </div>

          
          <div class="col-md-6 mb-3">
            <label class="form-label">Telefone</label>
            <input type="text" class="form-control" name="phone_number">
          </div>

          
          <div class="col-md-6 mb-3">
            <label class="form-label">Responsável</label>
            <input type="text" class="form-control" name="guardian_name">
          </div>

          
          <div class="col-md-6 mb-3">
            <label class="form-label">Telefone do responsável</label>
            <input type="text" class="form-control" name="guardian_phone">
          </div>
          
          <div class="col-md-12 mb-3">
            <label class="form-label">Observações</label>
            <textarea class="form-control" name="notes" rows="3"></textarea>
          </div>

        </div>

        <div class="d-flex justify-content-between mt-4">
          
          <a href="/admin/aluno?academy_id={{academy_id}}" class="btn btn-outline-secondary">
            ← Voltar
          </a>

          <button type="submit" class="btn btn-primary px-4 fw-bold">
            Cadastrar
          </button>

        </div>

      </form>

    </div>
  </div>

</section>
