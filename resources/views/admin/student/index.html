<div class="page-header mb-4">
  <h4 class="fw-bold mb-1">Alunos</h4>
  <p class="text-muted mb-0">Selecione uma academia para gerenciar os alunos.</p>
</div>

<div class="card shadow-sm border-0 filter-card mb-4">
  <div class="card-body p-4">

    <form method="GET">
      <label class="form-label">Academia</label>
      <select name="academy_id" class="form-select form-select-lg" onchange="this.form.submit()">
        {{academies}}
      </select>
    </form>

  </div>
</div>

<div class="d-grid d-sm-flex mb-4">
  <a href="/admin/aluno/cadastrar?academy_id={{academy_id}}" class="btn btn-primary btn-lg">
    <i class="bi bi-plus-lg me-1"></i>
    Cadastrar aluno
  </a>
</div>

<div class="card shadow-sm border-0 students-card">
  <div class="card-body p-0">

    <div class="table-responsive-md">
      <table class="table table-hover align-middle mb-0 responsive-table">
        <thead class="table-light">
          <tr>
            <th scope="col">#</th>
            <th scope="col">Nome completo</th>
            <th scope="col">Data de nascimento</th>
            <th scope="col">Telefone</th>
            <th scope="col">Responsável</th>
            <th scope="col">Telefone resp.</th>
            <th scope="col">Cadastro</th>
            <th scope="col">Ações</th>
          </tr>
        </thead>

        <tbody>
          {{students}}
        </tbody>
      </table>
    </div>

  </div>
</div>

<div class="mt-4 pagination-wrapper">
  {{pagination}}
</div>

<style>
  .filter-card {
    max-width: 720px;
    border-radius: 1rem;
  }

  .students-card {
    border-radius: 1rem;
    overflow: hidden;
  }

  @media (max-width: 767.98px) {
    .page-header {
      text-align: center;
    }

    .filter-card {
      max-width: 100%;
    }

    .responsive-table thead {
      display: none;
    }

    .responsive-table,
    .responsive-table tbody,
    .responsive-table tr,
    .responsive-table td {
      display: block;
      width: 100%;
    }

    .responsive-table tbody {
      padding: 0.75rem;
    }

    .responsive-table tr {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 1rem;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
    }

    .responsive-table td {
      border: 0;
      padding: 0.45rem 0;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      text-align: right;
      word-break: break-word;
    }

    .responsive-table td::before {
      content: attr(data-label);
      font-weight: 600;
      color: #64748b;
      text-align: left;
      flex-shrink: 0;
    }

    .responsive-table td:last-child {
      justify-content: flex-start;
      padding-top: 0.75rem;
      margin-top: 0.5rem;
      border-top: 1px solid #e5e7eb;
    }

    .responsive-table td:last-child::before {
      display: none;
    }

    .pagination-wrapper .pagination {
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.25rem;
    }
  }
</style>
