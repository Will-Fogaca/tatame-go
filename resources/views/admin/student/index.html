

<h4>Academias</h4>
<form method="GET">
  <select name="academy_id" class="form-select" onchange="this.form.submit()">
      {{academies}}
  </select>
</form>

<h4>Alunos</h4>

<a href="/admin/aluno/cadastrar?academy_id={{academy_id}}" class="btn btn-primary px-4 fw-bold"> Cadastrar aluno </a>

<table class="table table-light">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Nome completo</th>
      <th scope="col">Data de nascimento</th>
      <th scope="col">Telefone</th>
      <th scope="col">Nome do responsável</th>
      <th scope="col">Telefone do responsável</th>
      <th scope="col">Data de cadastro</th>
      <th scope="col"></th>
    </tr>
  </thead>
  <tbody>
     {{students}}
  </tbody>
</table>

{{pagination}}
