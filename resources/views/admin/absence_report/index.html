<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Relatório de Faltas</h4>
</div>

<div class="card mb-3">
    <div class="card-body py-2">
        <form method="GET" action="/admin/faltas" class="d-flex align-items-center gap-2 flex-wrap">
            <input type="hidden" name="tab" value="{{tab}}">
            <label class="form-label mb-0 fw-semibold">Academia:</label>
            <select name="academy_id" class="form-select form-select-sm w-auto" onchange="this.form.submit()">
                {{academies}}
            </select>
            {{filter_student}}
        </form>
    </div>
</div>

<ul class="nav nav-tabs mb-3">
    <li class="nav-item">
        <a class="nav-link {{tab_by_class}}" href="/admin/faltas?academy_id={{academy_id}}&tab=by_class">
            <i class="bi bi-calendar3 me-1"></i> Por aula
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link {{tab_by_student}}" href="/admin/faltas?academy_id={{academy_id}}&tab=by_student">
            <i class="bi bi-people me-1"></i> Por aluno
        </a>
    </li>
</ul>

{{table}}
