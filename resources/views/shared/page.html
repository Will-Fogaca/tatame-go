<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/public/css/style.css">

  <style>
    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    #app-layout {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    #app-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .mobile-topbar {
      min-height: 64px;
      position: sticky;
      top: 0;
      z-index: 1020;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 100%;
      padding: 2rem 1.5rem;
      overflow-x: hidden;
    }

    footer {
      width: 100%;
    }

    img,
    svg,
    canvas,
    video,
    iframe {
      max-width: 100%;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    @media (max-width: 767.98px) {
      #app-layout {
        display: block;
      }

      #app-content {
        width: 100%;
        min-height: 100vh;
      }

      main {
        padding: 1rem;
      }

      .container,
      .container-fluid,
      .container-sm,
      .container-md,
      .container-lg,
      .container-xl,
      .container-xxl {
        padding-left: 0;
        padding-right: 0;
        max-width: 100%;
      }

      .card {
        border-radius: 1rem;
      }

      .btn {
        min-height: 42px;
      }

      .btn-sm {
        min-height: 36px;
      }

      input,
      select,
      textarea {
        font-size: 16px !important;
      }
    }
  </style>
</head>

<body class="bg-light">

  <div id="app-layout">

    {{header}}

    <div id="app-content">

      <div class="mobile-topbar d-md-none bg-dark text-white px-3 d-flex align-items-center shadow-sm">
        <button
          class="btn btn-outline-light me-3"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#sidebar"
          aria-controls="sidebar"
          aria-label="Abrir menu"
        >
          <i class="bi bi-list"></i>
        </button>

        <strong class="text-truncate">TatameGO</strong>
      </div>

      <main>
        {{content}}
      </main>

      <footer>
        {{footer}}
      </footer>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
