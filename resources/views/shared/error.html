<div class="container mt-5">

  <div class="card border-danger shadow">
    
    <div class="card-header bg-danger text-white">
      <h5 class="mb-0">
        <i class="bi bi-exclamation-triangle"></i> Ocorreu um erro
      </h5>
    </div>

    <div class="card-body text-center">

      <h4 class="mb-3">{{title}}</h4>

      <p class="text-muted">
        {{message}}
      </p>

      <a href="{{back_url}}" class="btn btn-outline-secondary mt-3">
        ← Voltar
      </a>

    </div>

  </div>

</div>
