<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center px-3 py-4">

  <div class="card shadow-sm border-0 login-card w-100">
    <div class="card-body p-4 p-sm-5">

      <div class="text-center mb-4">
        <h4 class="fw-bold mb-1">Entrar no sistema</h4>
        <p class="text-muted mb-0">Acesse sua conta</p>
      </div>

      <form method="post">

        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input type="email" name="email" class="form-control form-control-lg" autocomplete="email" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" name="password" class="form-control form-control-lg" autocomplete="current-password" required>
        </div>

        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-2 mb-3">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="remember">
            <label class="form-check-label" for="remember">Lembrar</label>
          </div>

          <a href="/forgot-password" class="small text-decoration-none">
            Esqueci a senha
          </a>
        </div>

        {{status}}

        <button type="submit" class="btn btn-primary w-100 btn-lg">
          Entrar
        </button>

      </form>

      <hr class="my-4">

      <div class="text-center">
        <p class="mb-2 text-muted">Ainda não tem conta?</p>
        <a href="/registrar" class="btn btn-outline-primary w-100 btn-lg">
          Criar conta
        </a>
      </div>

    </div>
  </div>

</div>

<style>
  .login-card {
    max-width: 420px;
    border-radius: 1rem;
  }

  @media (max-width: 575.98px) {
    .login-card {
      max-width: 100%;
    }
  }
</style>
