<div class="container d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 72px);">

  <div class="card shadow-sm border-0" style="width: 100%; max-width: 420px;">
    <div class="card-body p-4">

      <div class="text-center mb-4">
        <h4 class="fw-bold">Entrar no sistema</h4>
        <p class="text-muted mb-0">Acesse sua conta</p>
      </div>

      <form method="post">

        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input type="email" name="email" class="form-control form-control-lg" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" name="password" class="form-control form-control-lg" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="remember">
            <label class="form-check-label" for="remember">Lembrar</label>
          </div>
          <a href="/forgot-password" class="small text-decoration-none">Esqueci a senha</a>
        </div>

        {{status}}

        <button type="submit" class="btn btn-primary w-100 btn-lg">
          Entrar
        </button>

      </form>

      <hr class="my-4">

      <div class="text-center">
        <p class="mb-2 text-muted">Ainda não tem conta?</p>
        <a href="/register" class="btn btn-outline-primary w-100">
          Criar conta
        </a>
      </div>

    </div>
  </div>

</div>
