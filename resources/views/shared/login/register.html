<div class="container d-flex align-items-center justify-content-center" style="min-height: 90vh;">

  <div class="card shadow-sm border-0" style="width: 100%; max-width: 500px;">
    <div class="card-body p-4">

      <!-- TÍTULO -->
      <div class="text-center mb-4">
        <h4 class="fw-bold">Criar conta</h4>
        <p class="text-muted mb-0">Cadastre-se para começar</p>
      </div>

      <!-- FORM -->
      <form method="post">

        <!-- NOME -->
        <div class="mb-3">
          <label class="form-label">Nome completo</label>
          <input type="text" name="name" class="form-control form-control-lg" required>
        </div>

        <!-- EMAIL -->
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input type="email" name="email" class="form-control form-control-lg" required>
        </div>

        <!-- TELEFONE -->
        <div class="mb-3">
          <label class="form-label">Telefone</label>
          <input type="text" name="phone_number" class="form-control form-control-lg" placeholder="(11) 99999-9999" required>
        </div>

        <!-- DOCUMENTO -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Documento</label>
            <input type="text" name="document" class="form-control">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Tipo</label>
            <select name="document_type" class="form-select">
              <option value="">Selecione</option>
              <option value="CPF">CPF</option>
              <option value="CNPJ">CNPJ</option>
            </select>
          </div>
        </div>

        <!-- SENHA -->
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" name="password" class="form-control form-control-lg" required>
        </div>

        <!-- CONFIRMAR SENHA -->
        <div class="mb-3">
          <label class="form-label">Confirmar senha</label>
          <input type="password" name="password_confirm" class="form-control form-control-lg" required>
        </div>

        {{status}}

        <!-- BOTÃO -->
        <button type="submit" class="btn btn-primary w-100 btn-lg">
          Criar conta
        </button>

      </form>

      <!-- DIVISOR -->
      <hr class="my-4">

      <!-- LOGIN -->
      <div class="text-center">
        <p class="mb-2 text-muted">Já tem uma conta?</p>
        <a href="/login" class="btn btn-outline-primary w-100">
          Entrar
        </a>
      </div>

    </div>
  </div>

</div>
