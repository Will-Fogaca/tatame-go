<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center px-3 py-4">

  <div class="card shadow border-0 register-card w-100">
    <div class="card-body p-4">

      <div class="text-center mb-4">
        <h3 class="fw-bold mb-1">Criar conta</h3>
        <p class="text-muted small mb-0">
          Cadastre-se para começar
        </p>
      </div>

      <form method="post">

        <div class="mb-3">
          <label class="form-label">Nome completo</label>
          <input
            type="text"
            name="name"
            class="form-control"
            autocomplete="name"
            required>
        </div>

        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input
            type="email"
            name="email"
            class="form-control"
            autocomplete="email"
            required>
        </div>

        <div class="mb-3">
          <label class="form-label">Telefone</label>
          <input
            type="text"
            name="phone_number"
            class="form-control"
            placeholder="(11) 99999-9999"
            autocomplete="tel"
            required>
        </div>

        <div class="row g-2">
          <div class="col-md-8">
            <label class="form-label">Documento</label>
            <input
              type="text"
              name="document"
              class="form-control">
          </div>

          <div class="col-md-4">
            <label class="form-label">Tipo</label>
            <select name="document_type" class="form-select">
              <option value="">Selecione</option>
              <option value="CPF">CPF</option>
              <option value="CNPJ">CNPJ</option>
            </select>
          </div>
        </div>

        <div class="mb-3 mt-3">
          <label class="form-label">Senha</label>
          <input
            type="password"
            name="password"
            class="form-control"
            autocomplete="new-password"
            required>
        </div>

        <div class="mb-3">
          <label class="form-label">Confirmar senha</label>
          <input
            type="password"
            name="password_confirm"
            class="form-control"
            autocomplete="new-password"
            required>
        </div>

        {{status}}

        <button
          type="submit"
          class="btn btn-primary w-100">
          Criar conta
        </button>

      </form>

      <div class="text-center mt-4">
        <small class="text-muted d-block mb-2">
          Já tem uma conta?
        </small>

        <a href="/login" class="text-decoration-none fw-semibold">
          Entrar
        </a>
      </div>

    </div>
  </div>

</div>

<style>
  .register-card {
    max-width: 430px;
    border-radius: 16px;
  }

  .form-control,
  .form-select {
    height: 44px;
    border-radius: 10px;
  }

  .btn-primary {
    height: 46px;
    border-radius: 10px;
    font-weight: 600;
  }

  @media (max-width: 576px) {
    .register-card {
      max-width: 100%;
    }
  }
</style>
